# GitHub Pages (Jekyll) config for babacut.io.
# The project record (Markdown) lives in docs/ too but must not be published on the website.
# The website is HTML only, so every Markdown file is excluded by one glob ("*.md" also matches
# files in subfolders). Do not list single record files here: a per-file list made every PR that
# adds a record file append to the same line and conflict with main (task dd98d806).
exclude:
  - "*.md"
  - changes
  - concepts
  - design
