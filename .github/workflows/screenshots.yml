# App screenshots on an Android emulator (task a6b39af0). Builds the debug APK, starts an API 35 emulator and runs
# scripts/screenshots/capture.sh (adb, am start, uiautomator, screencap) for the main views in en, fa and ar on a
# small screen (360x640 dp) and on the default Pixel 6 size. Test data only (synthetic emulator camera, typed text).
# Publishes nothing: read-only token, no secrets, no release, no tag, no push, no deployment. The PNGs go to the
# run artifact "app-screenshots" only. Not a required check; it does not block merges.
name: App screenshots

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'app/src/main/res/**'
      - 'app/src/main/java/**/*View*.kt'
      - 'app/src/main/java/**/Sheet*.kt'
      # changes to the screenshot run itself test themselves (workflow_dispatch only works once this file is on main)
      - '.github/workflows/screenshots.yml'
      - 'scripts/screenshots/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    name: screenshots (${{ matrix.tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: api35-small, size: 720x1280, density: 320 }      # 360x640 dp
          - { tag: api35-default, size: default, density: default } # pixel_6 profile, 1080x2400 @ 420 dpi
    steps:
      # Third-party actions are pinned to full commit SHAs (tag in the comment).
      - name: Checkout (with submodules)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install NDK, CMake and SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (read-only cache)
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true

      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator is installed and started with the Android SDK tools directly (sdkmanager, avdmanager, emulator);
      # no third-party emulator action.
      - name: Install emulator and API 35 system image
        run: |
          # one AVD directory for avdmanager and emulator (on the runner they default to different places)
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64" > /dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n shots -k "system-images;android-35;google_apis;x86_64" -d pixel_6

      - name: Start emulator and wait for boot
        run: |
          "$ANDROID_HOME/emulator/emulator" -avd shots -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim \
            -camera-back emulated -camera-front emulated > "$RUNNER_TEMP/emulator.log" 2>&1 &
          EMU_PID=$!
          ADB="$ANDROID_HOME/platform-tools/adb"
          "$ADB" start-server
          # cold boot without snapshot takes a few minutes; poll up to 10 min, fail early if the emulator process dies
          booted=0
          for i in $(seq 1 120); do
            kill -0 "$EMU_PID" 2>/dev/null || { echo "emulator process exited"; break; }
            [ "$(timeout 10 "$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && { booted=1; break; }
            sleep 5
          done
          if [ "$booted" != 1 ]; then
            "$ADB" devices -l || true
            tail -80 "$RUNNER_TEMP/emulator.log"
            exit 1
          fi
          "$ADB" shell input keyevent 82
          for s in window_animation_scale transition_animation_scale animator_duration_scale; do "$ADB" shell settings put global $s 0; done
          echo "emulator booted after ~$((i * 5)) s"

      - name: Screenshots on emulator (API 35)
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          bash scripts/screenshots/capture.sh ${{ matrix.tag }} ${{ matrix.size }} ${{ matrix.density }} en fa ar

      - name: Stop emulator
        if: always()
        run: |
          "$ANDROID_HOME/platform-tools/adb" emu kill || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-screenshots-${{ matrix.tag }}
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14

  # Merges both matrix artifacts into the one artifact "app-screenshots".
  collect:
    name: app-screenshots
    needs: shots
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Merge artifacts
        uses: actions/upload-artifact/merge@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-screenshots
          pattern: app-screenshots-*
          retention-days: 14

      - name: Summary
        run: |
          {
            echo "### App screenshots"
            echo "- Matrix result: ${{ needs.shots.result }}"
            echo "- Artifact \`app-screenshots\`: <tag>-<locale>-<nn>-<view>.png for en, fa, ar"
            echo "- Views: record, settings sheet, text sheet, review, caption sheet, export sheet"
            echo "- No release, tag, push or deployment is created by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
