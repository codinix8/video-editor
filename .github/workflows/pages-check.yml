# Pages check: builds docs/ the way GitHub Pages does (official Jekyll action, github-pages gem)
# and fails if any Markdown file of docs/ (project record, excluded by "*.md" in docs/_config.yml)
# reaches the site.
# Runs only when docs/ changes. Deliberately deploys nothing; the live site is still built by
# GitHub Pages from main:/docs.
name: Pages check

on:
  pull_request:
    branches: [ main ]
    paths: [ 'docs/**', '.github/workflows/pages-check.yml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages-exclude:
    name: pages-exclude
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build docs/ with Jekyll (GitHub Pages)
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: No Markdown file of docs/ is in the site
        run: |
          set -eu
          test -f _site/index.html || { echo "::error::_site/index.html missing"; exit 1; }
          # The site is HTML only; every Markdown file under docs/ is project record and is excluded
          # by the glob "*.md" in docs/_config.yml (no per-file list, see task dd98d806).
          fail=0
          n=0
          while IFS= read -r p; do
            f="${p#docs/}"
            base="${f%.md}"
            n=$((n+1))
            for out in "_site/$f" "_site/$base.html" "_site/$base/index.html"; do
              if [ -e "$out" ]; then echo "::error::$out is published but $p is project record"; fail=1; fi
            done
          done < <(find docs -name '*.md' -type f | sort)
          # Belt and braces: no Markdown output anywhere in the built site.
          if find _site -name '*.md' | grep -q .; then
            echo "::error::Markdown files in the site:"; find _site -name '*.md'; fail=1
          fi
          echo "checked $n Markdown files under docs/"
          exit $fail
