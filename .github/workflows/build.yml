name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: NDK und CMake installieren
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten (mit Cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Debug-APK bauen
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Fehlerprotokoll veröffentlichen
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/logs && cp build.log /tmp/logs/build.log
          cd /tmp/logs
          git init -q -b build-logs
          git config user.email "ci@videoeditor" && git config user.name "CI"
          git add build.log && git commit -qm "Build ${{ github.run_number }} fehlgeschlagen"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" build-logs

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/VideoEditor-build${{ github.run_number }}.apk

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: VideoEditor-APK
          path: out/*.apk
          retention-days: 30

      - name: Release mit APK anlegen (direkt vom Handy ladbar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" out/*.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "Automatischer Build von Commit ${{ github.sha }}. APK herunterladen und auf dem Handy installieren."
